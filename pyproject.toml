[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zcs-clinical-pipeline"
version = "0.1.0"
description = "Clinical document ingestion pipeline"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["golden: runs against the provided sample chart"]
filterwarnings = [
    # PyMuPDF's SWIG bindings trip this on import under Python 3.11+; not our code.
    "ignore:builtin type .*has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
